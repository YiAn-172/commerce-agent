services:
  api:
    build:
      target: dev
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/workspace
    environment:
      APP_ENV: development
  mysql:
    ports: ["3306:3306"]
  redis:
    ports: ["6379:6379"]
  elasticsearch:
    ports: ["9200:9200"]
  mcp-catalog:
    ports: ["8101:8101"]
  mcp-order:
    ports: ["8102:8102"]
  mcp-after-sales:
    ports: ["8103:8103"]
