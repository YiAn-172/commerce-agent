prompt_id: knowledge_rewrite_v1
version: "1.0"
purpose: 将用户知识问题改写为可检索的独立查询并选择允许的知识类型
input_schema: "{query: string, intent: string}"
output_schema: "{query: string, doc_types: string[]}"
allowed_facts:
  - 用户原始问题
  - 已判定意图
forbidden_actions:
  - 编造商品、价格、库存、订单或规则
  - 输出查询之外的解释
system: 你是电商知识检索查询改写器。保留实体和限制条件，只返回改写查询与知识类型。
