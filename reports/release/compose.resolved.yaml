name: commerce-agent
networks:
  commerce-net:
    name: commerce-agent-net
  default:
    name: commerce-agent_default
services:
  api:
    build:
      context: C:\Users\mtcbf\Desktop\commerce-agent
      dockerfile: infra/docker/python.Dockerfile
      target: runtime
    command:
    - uvicorn
    - apps.api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    depends_on:
      cache-init:
        condition: service_completed_successfully
        required: true
      mysql:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      APP_ENV: local
      APP_SECRET: <redacted>
      CHECKPOINT_DB: /cache/checkpoints/checkpoints.sqlite
      CLARIFY_THRESHOLD: '0.55'
      COMPOSE_PROJECT_NAME: commerce-agent
      DEEPSEEK_API_KEY: <redacted>
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MAX_RETRIES: '1'
      DEEPSEEK_MODEL: deepseek-flash
      DEEPSEEK_TEMPERATURE: '0.1'
      DEEPSEEK_TIMEOUT_SECONDS: '30'
      DEMO_AUTH_ENABLED: 'true'
      DIRECT_ROUTE_THRESHOLD: '0.78'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      HF_HOME: /cache/huggingface
      INTENT_MODEL_PATH: /workspace/models/intent_classifier/current
      LOG_LEVEL: INFO
      MAX_GRAPH_STEPS: '30'
      MAX_LLM_CALLS: '3'
      MAX_TOOL_CALLS: '5'
      MILVUS_URI: http://milvus:19530
      MYSQL_DATABASE: commerce
      MYSQL_DSN: <redacted>
      MYSQL_PASSWORD: <redacted>
      MYSQL_ROOT_PASSWORD: <redacted>
      MYSQL_USER: commerce
      REDIS_URL: redis://redis:6379/0
      RERANKER_MODEL: BAAI/bge-reranker-base
      ROUTE_MARGIN: '0.20'
    healthcheck:
      interval: 10s
      retries: 12
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8000/health/live
      timeout: 3s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      commerce-net: null
    ports:
    - mode: ingress
      protocol: tcp
      published: '8000'
      target: 8000
    profiles:
    - dev-lite
    - demo-full
    restart: unless-stopped
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: C:\Users\mtcbf\Desktop\commerce-agent\configs
      target: /workspace/configs
      type: bind
    - bind:
        create_host_path: true
      read_only: true
      source: C:\Users\mtcbf\Desktop\commerce-agent\models
      target: /workspace/models
      type: bind
    - source: hf-cache
      target: /cache/huggingface
      type: volume
      volume: {}
    - source: checkpoint-data
      target: /cache/checkpoints
      type: volume
      volume: {}
  cache-init:
    command:
    - sh
    - -c
    - chown -R 10001:10001 /cache/huggingface /cache/checkpoints
    image: alpine:3.21.3
    networks:
      default: null
    profiles:
    - tooling
    - dev-lite
    - demo-full
    - train
    - test
    restart: 'no'
    user: 0:0
    volumes:
    - source: hf-cache
      target: /cache/huggingface
      type: volume
      volume: {}
    - source: checkpoint-data
      target: /cache/checkpoints
      type: volume
      volume: {}
  elasticsearch:
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      discovery.type: single-node
      xpack.security.enabled: 'false'
    healthcheck:
      interval: 15s
      retries: 20
      start_period: 45s
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow ||
        exit 1
      timeout: 5s
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.7
    networks:
      commerce-net: null
    profiles:
    - core
    - dev-lite
    - demo-full
    - test
    restart: unless-stopped
    volumes:
    - source: es-data
      target: /usr/share/elasticsearch/data
      type: volume
      volume: {}
  etcd:
    command:
    - etcd
    - -advertise-client-urls=http://127.0.0.1:2379
    - -listen-client-urls=http://0.0.0.0:2379
    - --data-dir
    - /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    healthcheck:
      interval: 10s
      retries: 12
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      timeout: 5s
    image: quay.io/coreos/etcd:v3.5.18
    networks:
      commerce-net: null
    profiles:
    - demo-full
    - test
    volumes:
